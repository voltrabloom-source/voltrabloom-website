<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VoltraBloom 3D Prototype Viewer — Minimal empty-space view of the VoltraBloom hybrid energy harvesting unit.">
<title>VoltraBloom 3D Model Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  body { margin: 0; background-color: #FAF6EE; overflow: hidden; font-family: 'Inter', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel-info {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(255,255,255,0.9);
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(38,30,20,0.1);
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .panel-info h1 { font-size: 13px; margin: 0 0 2px; font-weight: 700; color: #261E14; letter-spacing: -.01em; }
  .panel-info p  { font-size: 10px; margin: 0; color: #8a7e6e; }
  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a7e6e;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="panel-info" role="note" aria-label="Controls">
  <h1>VoltraBloom 3D Prototype</h1>
  <p>Klik Kiri + Geser untuk Memutar &nbsp;|&nbsp; Scroll untuk Zoom</p>
</div>

<div class="loading" id="loading">Loading model&hellip;</div>

<canvas id="c3d" aria-label="VoltraBloom 3D prototype model" role="img"></canvas>

<script>
function verifyAndStart() {
  if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined') {
    buildModel();
  } else {
    setTimeout(verifyAndStart, 50);
  }
}
verifyAndStart();

function buildModel() {
  const canvas = document.getElementById('c3d');
  const loadingEl = document.getElementById('loading');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFAF6EE);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(30, 25, 40);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0, 0);
  controls.minDistance = 5;
  controls.maxDistance = 100;

  const sunLight = new THREE.DirectionalLight(0xFFF5E6, 1.8);
  sunLight.position.set(15, 30, 15);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(1024, 1024);
  scene.add(sunLight);

  const ambLight = new THREE.AmbientLight(0x90A080, 0.65);
  scene.add(ambLight);

  const fillLight = new THREE.DirectionalLight(0xB0C0A0, 0.35);
  fillLight.position.set(-10, 5, -10);
  scene.add(fillLight);

  const gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load(
    '3d_models/3D_model _voltrabloom.glb',
    function(gltf) {
      const model = gltf.scene;

      const bbox = new THREE.Box3().setFromObject(model);
      const size = bbox.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const scale = 25 / maxDim;
        model.scale.set(scale, scale, scale);
      }

      const bboxScaled = new THREE.Box3().setFromObject(model);
      const center = bboxScaled.getCenter(new THREE.Vector3());
      model.position.sub(center);

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(model);
      if (loadingEl) loadingEl.style.display = 'none';
    },
    undefined,
    function(error) {
      console.error('Error loading GLTF model in viewer_3d.html:', error);
      if (loadingEl) loadingEl.textContent = 'Failed to load 3D model';
    }
  );

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
