<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VoltraBloom 3D Prototype Viewer — Interactive 3D model of the VoltraBloom hybrid energy harvesting unit.">
<title>VoltraBloom 3D Model Viewer</title>
<!-- FIX: Replaced broken root-domain CDN URLs with correct Three.js library paths -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  body { margin: 0; background-color: #FAF6EE; overflow: hidden; font-family: 'Inter', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel-info {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(255,255,255,0.9);
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(38,30,20,0.1);
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .panel-info h1 { font-size: 13px; margin: 0 0 2px; font-weight: 700; color: #261E14; letter-spacing: -.01em; }
  .panel-info p  { font-size: 10px; margin: 0; color: #8a7e6e; }
  .badge {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 10;
    background: rgba(226,160,63,.12);
    border: 1px solid rgba(226,160,63,.3);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #E2A03F;
    font-family: sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="panel-info" role="note" aria-label="Controls">
  <h1>VoltraBloom 3D Prototype</h1>
  <p>Klik Kiri + Geser untuk Memutar &nbsp;|&nbsp; Scroll untuk Zoom</p>
</div>

<div class="badge">Hybrid Energy System &bull; ESP32 IoT</div>

<canvas id="c3d" aria-label="VoltraBloom 3D prototype model" role="img"></canvas>

<script>
// FIX: Guard function now works correctly because THREE and OrbitControls load from valid CDN URLs.
// Poll until THREE, THREE.OrbitControls and THREE.GLTFLoader are available.
function verifyAndStart() {
  if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined') {
    buildModel();
  } else {
    setTimeout(verifyAndStart, 50);
  }
}
verifyAndStart();

function buildModel() {
  const canvas = document.getElementById('c3d');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFAF6EE);
  scene.fog = new THREE.FogExp2(0xFAF6EE, 0.013);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(30, 25, 40);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputEncoding = THREE.sRGBEncoding; // valid for r128

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(5, 5, 0);
  controls.minDistance = 10;
  controls.maxDistance = 100;

  // Lighting
  const sunLight = new THREE.DirectionalLight(0xFFF5E6, 1.8);
  sunLight.position.set(15, 30, 15);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(1024, 1024);
  scene.add(sunLight);

  const ambLight = new THREE.AmbientLight(0x90A080, 0.6);
  scene.add(ambLight);

  const fillLight = new THREE.DirectionalLight(0xB0C0A0, 0.3);
  fillLight.position.set(-10, 5, -10);
  scene.add(fillLight);

  const masterGroup = new THREE.Group();
  scene.add(masterGroup);

  // --- Materials ---
  const acrylicMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    roughness: 0.08,
    metalness: 0.05,
    transmission: 0.85,
    transparent: true,
    opacity: 0.45,
    clearcoat: 1.0,
    clearcoatRoughness: 0.1,
    ior: 1.49,
    side: THREE.DoubleSide
  });
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xD8D0C4, roughness: 0.4, metalness: 0.05 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x3A3428, roughness: 0.6 });
  const coreMat = new THREE.MeshStandardMaterial({ color: 0x4D7C0F, emissive: 0x2A4A08, emissiveIntensity: 0.5, roughness: 0.4 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xE2A03F, metalness: 0.3, roughness: 0.4 });
  const panelMat = new THREE.MeshStandardMaterial({ color: 0x1A2840, metalness: 0.4, roughness: 0.3, emissive: 0x0A1428, emissiveIntensity: 0.1 });

  // --- Box 1: Main acrylic enclosure ---
  const box1 = new THREE.Mesh(new THREE.BoxGeometry(22, 15, 22), acrylicMat);
  box1.position.set(0, 7.5, 0);
  box1.castShadow = true;
  masterGroup.add(box1);

  // Lid (hinged, slightly open)
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, 15, -11);
  const lidMesh = new THREE.Mesh(new THREE.BoxGeometry(21.8, 0.4, 21.8), bodyMat);
  lidMesh.position.set(0, 0.2, 11);
  lidPivot.add(lidMesh);
  lidPivot.rotation.x = -Math.PI * 0.1;
  masterGroup.add(lidPivot);

  // --- Box 2: Electronics bay ---
  const box2 = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 22), bodyMat);
  box2.position.set(22, 2.5, 0);
  box2.castShadow = true;
  masterGroup.add(box2);

  // --- Battery Core ---
  const innerCore = new THREE.Mesh(new THREE.BoxGeometry(8.5, 12, 8.5), coreMat);
  innerCore.position.set(-4, 6, 4);
  masterGroup.add(innerCore);

  // --- Solar Panel ---
  const solarPanel = new THREE.Mesh(new THREE.BoxGeometry(20, 0.2, 20), panelMat);
  solarPanel.position.set(0, 15.1, 0);
  masterGroup.add(solarPanel);

  // Solar cell grid lines
  for (let i = -2; i <= 2; i++) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.04, 0.8), panelMat);
    bar.position.set(i * 4.6, 15.32, 0);
    masterGroup.add(bar);
  }

  // --- Vertical Axis Wind Turbine ---
  const turbinePole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 8, 10), darkMat);
  turbinePole.position.set(12, 11, 0); // Corrected: sits above box2 at y=5 + 8/2=9 → pole top at 15
  turbinePole.position.y = 5 + 4; // Base at box2 top (y=5), pole 8cm tall
  masterGroup.add(turbinePole);

  const turbineHub = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.5, 10), bodyMat);
  turbineHub.position.set(12, 13, 0);
  masterGroup.add(turbineHub);

  // Blade group for rotation animation
  const turbineBladesGroup = new THREE.Group();
  turbineBladesGroup.position.set(12, 13, 0);
  masterGroup.add(turbineBladesGroup);

  for (let b = 0; b < 3; b++) {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3, 0.08), accentMat);
    blade.rotation.y = b * (Math.PI * 2 / 3);
    blade.position.x = Math.cos(b * (Math.PI * 2 / 3)) * 2.25;
    blade.position.z = Math.sin(b * (Math.PI * 2 / 3)) * 2.25;
    turbineBladesGroup.add(blade);
  }

  // --- Wiring ---
  const wireOrangeMat = new THREE.LineBasicMaterial({ color: 0xE2A03F });
  const wireGreenMat  = new THREE.LineBasicMaterial({ color: 0x4D7C0F });

  const greenPts = [new THREE.Vector3(-4,6,4), new THREE.Vector3(-4,2,4), new THREE.Vector3(5,2,0), new THREE.Vector3(11,2,0)];
  masterGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(greenPts), wireGreenMat));

  const orangePts = [new THREE.Vector3(0,15.2,0), new THREE.Vector3(5,10,0), new THREE.Vector3(22,2.5,0)];
  masterGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orangePts), wireOrangeMat));

  // --- Ground ---
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0xE8E0D4, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  // --- Load Frantic_Kasi_v1.glb (layered on top of procedural scene) ---
  const gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load(
    '3d_models/Frantic_Kasi_v1.glb',
    function(gltf) {
      const gltfModel = gltf.scene;

      // Auto-scale to a robust display size (matches index.html normalization)
      const bbox = new THREE.Box3().setFromObject(gltfModel);
      const size = bbox.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const scale = 25 / maxDim;
        gltfModel.scale.set(scale, scale, scale);
      }

      // Center the model after scaling
      const bboxScaled = new THREE.Box3().setFromObject(gltfModel);
      const center = bboxScaled.getCenter(new THREE.Vector3());
      gltfModel.position.sub(center);
      gltfModel.position.y += 2; // Lift above ground

      gltfModel.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      masterGroup.add(gltfModel);
    },
    undefined,
    function(error) {
      console.error('Error loading GLTF model in viewer_3d.html:', error);
    }
  );

  masterGroup.position.set(-5, 0, 0);

  // --- Resize handler ---
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // --- Animation loop ---
  function animate() {
    requestAnimationFrame(animate);
    turbineBladesGroup.rotation.y += 0.012; // Smooth VAWT rotation
    innerCore.rotation.y += 0.004;          // Core pulse spin
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
